name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
      - "signing/**"
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version (without the v prefix)
        required: true
        default: '3.9.8'
      version_code:
        description: Android version code (must exceed every published build)
        required: true
        default: '20000'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate app and build installable signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Ordinary pushes and PRs validate without release secrets. A manual
      # dispatch is the explicit, auditable operation that publishes a release.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK for compile validation
        run: ./gradlew assembleDebug

      - name: Restore permanent Allo signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          ALLO_SIGNING_BUNDLE: ${{ secrets.ALLO_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${ALLO_SIGNING_BUNDLE:-}" ]; then
            echo "::error::Repository secret ALLO_SIGNING_BUNDLE is missing. Refusing to create a release APK with a temporary/debug signer."
            exit 1
          fi
          printf '%s' "$ALLO_SIGNING_BUNDLE" | base64 --decode > /tmp/allo-signing-bundle.zip
          unzip -q /tmp/allo-signing-bundle.zip -d .
          test -f keystore.properties
          test -f .ci-signing/allo-update.p12
          chmod 600 keystore.properties .ci-signing/allo-update.p12
          rm -f /tmp/allo-signing-bundle.zip

      - name: Build canonical signed update APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION_CODE='${{ inputs.version_code }}'
          VERSION_NAME='${{ inputs.version_name }}'
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::version_code must be a positive integer"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::version_name must be a semantic version"; exit 1; }
          echo "ALLO_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ALLO_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew assembleRelease -PALLO_VERSION_CODE="$VERSION_CODE" -PALLO_VERSION_NAME="$VERSION_NAME"

      - name: Verify package, version and signing certificate
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$RELEASE_APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" | tee /tmp/signing-report.txt

          EXPECTED="$(tr -d ':[:space:]' < signing/allo-update-cert.sha256 | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$RELEASE_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate mismatch. Expected $EXPECTED, got ${ACTUAL:-missing}."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$RELEASE_APK" | head -n 1)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [ "$PACKAGE" != "com.kenza.callsim" ]; then
            echo "::error::Unexpected package id: $PACKAGE"
            exit 1
          fi
          if [ "$VERSION" != "$ALLO_VERSION_CODE" ]; then
            echo "::error::Unexpected versionCode: $VERSION (expected $ALLO_VERSION_CODE)"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$ALLO_VERSION_NAME" ]; then
            echo "::error::Unexpected versionName: $VERSION_NAME (expected $ALLO_VERSION_NAME)"
            exit 1
          fi

          mkdir -p dist
          cp "$RELEASE_APK" "dist/Allo-update-vc${ALLO_VERSION_CODE}.apk"
          cp /tmp/signing-report.txt dist/signing-report.txt
          printf 'package=%s\nversionCode=%s\nversionName=%s\ncertificateSha256=%s\n' \
            "$PACKAGE" "$VERSION" "$VERSION_NAME" "$EXPECTED" > dist/update-metadata.txt

      - name: Upload only the installable update APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: allo-installable-update
          path: |
            dist/Allo-update-*.apk
            dist/signing-report.txt
            dist/update-metadata.txt
          if-no-files-found: error

  publish:
    name: Publish verified APK
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v6
        with:
          name: allo-installable-update
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLO_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          TAG="v${ALLO_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Dispatch with a new version."
            exit 1
          fi
          gh release create "$TAG" \
            dist/Allo-update-*.apk \
            dist/signing-report.txt \
            dist/update-metadata.txt \
            --target "$GITHUB_SHA" \
            --title "Allo ${ALLO_VERSION_NAME}" \
            --generate-notes
